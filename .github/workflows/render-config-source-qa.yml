name: Render configuration source QA
on:
  push:
    branches: [feat/render-yaml-config]
    paths: [.github/workflows/render-config-source-qa.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/feat/render-yaml-config'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve and record only the dependency lock
        run: |
          python -m pip install poetry==2.4.1
          poetry lock
          poetry check --lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poetry.lock
          if ! git diff --cached --quiet; then
            git commit -m 'Lock PyYAML dependency with Poetry 2.4.1'
            git push origin HEAD:refs/heads/feat/render-yaml-config
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: render-config-poetry-lock
          path: poetry.lock
          retention-days: 1
