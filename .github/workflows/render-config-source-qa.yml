name: Render configuration source QA
on:
  push:
    branches: [feat/render-yaml-config]
    paths: [.github/workflows/render-config-source-qa.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve dependency lock
        run: |
          python -m pip install poetry==2.4.1
          poetry lock
          poetry check --lock
      - uses: actions/upload-artifact@v4
        with:
          name: render-config-poetry-lock
          path: poetry.lock
          retention-days: 1
