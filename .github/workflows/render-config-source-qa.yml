name: Render configuration source QA
on:
  push:
    branches: [feat/render-yaml-config]
    paths: [.github/workflows/render-config-source-qa.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0dd7f242bc8b195fb88e7a870395a2ebde861f3
          persist-credentials: false
      - name: Archive the reviewed baseline (no environment or credentials)
        run: git archive --format=zip HEAD -o baseline-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: render-config-baseline-source
          path: baseline-source.zip
          retention-days: 1
