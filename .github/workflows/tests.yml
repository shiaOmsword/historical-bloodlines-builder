name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip install pytest

      - name: Run tests
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Docker renderer smoke test
        run: sh scripts/docker_smoke.sh

  xray-proxy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Initialize Compose environment
        run: make init

      - name: Generate and validate XHTTP TLS configuration
        run: |
          python3 scripts/configure_vless_proxy.py --engine xray \
            'vless://11111111-1111-1111-1111-111111111111@example.com:443?type=xhttp&security=tls&sni=example.com&fp=chrome&path=%2Ftelegram&mode=auto'
          make proxy-check-xray
