# readable, and brings spouses slightly closer together for the current review round.
version: 1

typography:
  font_size_pt: 15.2
  line_height_pt: null
  title_font_size_pt: 21
  note_font_size_pt: 15.2

layout:
  person_gap_pt: 28

pdf:
  page_format: a5
