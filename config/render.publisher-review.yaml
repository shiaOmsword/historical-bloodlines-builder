# Publisher review profile based on +2 typography.
# Keeps the accepted body/title sizes and makes the long Lancaster/York
# footnote readable without changing the stable +2 preset.
version: 1

typography:
  font_size_pt: 15.2
  line_height_pt: null
  title_font_size_pt: 21
  note_font_size_pt: 15.2

pdf:
  page_format: a5
